name: Bug
description: Algo no funciona como debería
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. **No incluyas datos personales** (placa, VIN,
        teléfono, IDs de Google Sheets, capturas con esos datos).
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Descripción clara del problema.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir la app con ?demo=1
        2. Ir a Mantenimientos
        3. …
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
  - type: dropdown
    id: entorno
    attributes:
      label: Dónde ocurre
      options:
        - GitHub Pages (navegador)
        - Local con npm run dev
        - Versión Google Sheets (Apps Script)
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador y versión
      placeholder: Chrome 141, Safari 19, Firefox 145…
  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Consola, capturas o el resultado de `npm run typecheck`.
